name: Deployment to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

env:
  REPO_NAME: ${{ github.event.repository.name }}
  REPO_OWNER: ${{ github.repository_owner }}
  HUGO_VERSION: "0.157.0"
  GO_VERSION: "1.22.0"

# Required for the modern deploy-pages action
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          fetch-depth: 0

      - name: Install Go (direct, no Node.js dependency)
        run: |
          wget -O ${{ runner.temp }}/go.tar.gz \
            https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz
          sudo tar -C /usr/local -xzf ${{ runner.temp }}/go.tar.gz
          echo "/usr/local/go/bin" >> $GITHUB_PATH

      - name: Setup Hugo (direct install, no Node.js dependency)
        run: |
          wget -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      - name: Install npm dependencies
        run: npm ci

      - name: Download Go modules (Docsy)
        run: go mod download

      - name: Build main (v1.6.4)
        run: |
          hugo \
            --baseURL https://docs.heartsecsuite.com \
            --minify

      - name: Check links and anchors with htmltest
        uses: wjdp/htmltest-action@31be84a95c860a331e0cf9a99f71e3eb39d2f86b # master 2023-03-28
        with:
          config: .htmltest.yml

      - name: Check for banned terminology
        run: npm run check:terms

      - name: Lint Markdown
        run: npm run check:markdown

      - name: Check for invalid Goldmark alert types
        run: |
          invalid=$(grep -rn '\[!' content/ --include="*.md" \
            | grep -Ev '\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]' || true)
          if [ -n "$invalid" ]; then
            echo "$invalid"
            echo "Error: invalid Goldmark alert type — allowed: NOTE, TIP, IMPORTANT, WARNING, CAUTION"
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
