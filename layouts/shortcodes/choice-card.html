<div class="col-md-6 d-flex">
  <div class="card h-100 w-100 hs-choice-card">
    {{ with .Get "header" -}}
    <div class="card-header">{{ . | $.Page.RenderString }}</div>
    {{ end -}}
    <div class="card-body">
      {{/* default RenderString is inline and strips the wrapping <p> from a single paragraph */}}
      {{ .Inner | $.Page.RenderString (dict "display" "block") }}
    </div>
  </div>
</div>
